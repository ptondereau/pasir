name: Binaries

on:
  workflow_dispatch:
  release:
    types:
      - created

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-musl:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        arch:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    runs-on: ${{ matrix.arch.runner }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          build-args: PHP_VERSION=${{ matrix.php }}
          cache-from: type=gha,scope=musl-${{ matrix.arch.target }}-php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=musl-${{ matrix.arch.target }}-php${{ matrix.php }}
          file: docker/musl.Dockerfile
          load: true
          push: false
          secrets: github_token=${{ github.token }}
          tags: pasir:build
      - run: docker cp $(docker run -d pasir:build):/usr/local/bin/pasir ./pasir-${{ matrix.arch.target }}-php${{ matrix.php }}
      - if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} pasir-${{ matrix.arch.target }}-php${{ matrix.php }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
